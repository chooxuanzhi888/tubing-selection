<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="cementPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 0 12 L 12 0 M 0 0 L 12 12" stroke="#94a3b8" stroke-width="1"/>
    </pattern>
    
    <pattern id="formationPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 8 Q 4 4 8 8 T 16 8" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
    </pattern>

    <pattern id="perforationPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#ef4444"/>
    </pattern>

    <linearGradient id="conductorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/><stop offset="50%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/><stop offset="50%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="interGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="50%" stop-color="#64748b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/><stop offset="50%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="tubingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/><stop offset="50%" stop-color="#fde047"/><stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">WELLBORE CASING ARCHITECTURE & PRODUCTION TUBING</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">Technical Cross-Section Schematic (Telescoping Design)</text>

  <rect x="50" y="80" width="800" height="980" fill="url(#formationPattern)"/>

  <rect x="220" y="140" width="460" height="180" fill="url(#cementPattern)"/>
  
  <rect x="260" y="320" width="380" height="220" fill="url(#cementPattern)"/>

  <rect x="300" y="540" width="300" height="240" fill="url(#cementPattern)"/>

  <rect x="340" y="780" width="220" height="250" fill="url(#cementPattern)"/>

  <g id="conductor-string">
    <rect x="235" y="140" width="12" height="180" fill="url(#conductorGrad)" stroke="#0f172a" stroke-width="1"/>
    <rect x="653" y="140" width="12" height="180" fill="url(#conductorGrad)" stroke="#0f172a" stroke-width="1"/>
    <path d="M 235 320 L 247 320 L 235 330 Z" fill="#0f172a"/>
    <path d="M 665 320 L 653 320 L 665 330 Z" fill="#0f172a"/>
  </g>

  <g id="surface-string">
    <rect x="275" y="120" width="10" height="420" fill="url(#surfaceGrad)" stroke="#0f172a" stroke-width="1"/>
    <rect x="615" y="120" width="10" height="420" fill="url(#surfaceGrad)" stroke="#0f172a" stroke-width="1"/>
    <path d="M 275 540 L 285 540 L 275 550 Z" fill="#0f172a"/>
    <path d="M 625 540 L 615 540 L 625 550 Z" fill="#0f172a"/>
  </g>

  <g id="intermediate-string">
    <rect x="315" y="100" width="8" height="680" fill="url(#interGrad)" stroke="#0f172a" stroke-width="1"/>
    <rect x="577" y="100" width="8" height="680" fill="url(#interGrad)" stroke="#0f172a" stroke-width="1"/>
    <path d="M 315 780 L 323 780 L 315 790 Z" fill="#0f172a"/>
    <path d="M 585 780 L 577 780 L 585 790 Z" fill="#0f172a"/>
  </g>

  <g id="production-string">
    <rect x="355" y="80" width="6" height="950" fill="url(#prodGrad)" stroke="#0f172a" stroke-width="1"/>
    <rect x="539" y="80" width="6" height="950" fill="url(#prodGrad)" stroke="#0f172a" stroke-width="1"/>
    <path d="M 355 1030 L 361 1030 L 361 1040 Z" fill="#0c4a6e"/>
    <path d="M 545 1030 L 539 1030 L 539 1040 Z" fill="#0c4a6e"/>
  </g>

  <g id="wellhead-assembly">
    <path d="M 220 140 L 220 120 L 255 120 L 255 140 Z" fill="url(#steelDark)" stroke="#0f172a"/>
    <path d="M 680 140 L 680 120 L 645 120 L 645 140 Z" fill="url(#steelDark)" stroke="#0f172a"/>
    
    <path d="M 255 120 L 255 100 L 290 100 L 290 120 Z" fill="#475569" stroke="#0f172a"/>
    <path d="M 645 120 L 645 100 L 610 100 L 610 120 Z" fill="#475569" stroke="#0f172a"/>

    <path d="M 290 100 L 290 80 L 330 80 L 330 100 Z" fill="#334155" stroke="#0f172a"/>
    <path d="M 610 100 L 610 80 L 570 80 L 570 100 Z" fill="#334155" stroke="#0f172a"/>

    <path d="M 330 80 L 330 60 L 370 60 L 370 80 Z" fill="#1e293b" stroke="#0f172a"/>
    <path d="M 570 80 L 570 60 L 530 60 L 530 80 Z" fill="#1e293b" stroke="#0f172a"/>

    <rect x="380" y="30" width="140" height="30" fill="#dc2626" rx="3" stroke="#991b1b" stroke-width="1.5"/>
    <text x="450" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">XMAS TREE / FLOW</text>
  </g>

  <rect x="442" y="60" width="16" height="920" fill="#ef4444" fill-opacity="0.15"/>

  <g id="production-tubing">
    <polygon points="370,60 530,60 510,80 390,80" fill="url(#tubingGrad)" stroke="#78350f" stroke-width="1.5"/>

    <rect x="436" y="80" width="6" height="900" fill="url(#tubingGrad)" stroke="#78350f" stroke-width="0.8"/>
    <rect x="458" y="80" width="6" height="900" fill="url(#tubingGrad)" stroke="#78350f" stroke-width="0.8"/>

    <rect x="426" y="200" width="48" height="30" rx="2" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
    <text x="450" y="218" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">TRSSV</text>

    <path d="M 436 440 L 420 440 L 416 465 L 436 470 Z" fill="#b45309" stroke="#78350f"/>

    <g id="production-packer">
      <rect x="361" y="820" width="75" height="35" fill="#1e293b" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="464" y="820" width="75" height="35" fill="#1e293b" stroke="#dc2626" stroke-width="1.5"/>
      
      <path d="M 361 805 L 436 805 L 426 820 L 371 820 Z" fill="#64748b" stroke="#0f172a"/>
      <path d="M 464 805 L 539 805 L 529 820 L 474 820 Z" fill="#64748b" stroke="#0f172a"/>
      <path d="M 371 855 L 426 855 L 436 870 L 361 870 Z" fill="#64748b" stroke="#0f172a"/>
      <path d="M 474 855 L 529 855 L 539 870 L 464 870 Z" fill="#64748b" stroke="#0f172a"/>
    </g>

    <path d="M 436 980 L 458 980 L 452 1000 L 442 1000 Z" fill="url(#tubingGrad)" stroke="#78350f"/>
  </g>

  <g id="perforations">
    <rect x="345" y="930" width="10" height="50" fill="url(#perforationPattern)"/>
    <path d="M 320 940 L 355 940 M 320 955 L 355 955 M 320 970 L 355 970" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 2"/>
    
    <rect x="545" y="930" width="10" height="50" fill="url(#perforationPattern)"/>
    <path d="M 545 940 L 580 940 M 545 955 L 580 955 M 545 970 L 580 970" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 2"/>

    <text x="310" y="960" text-anchor="end" font-size="11" font-weight="700" fill="#ef4444">Payzone Perforations</text>
  </g>

  <line x1="241" y1="230" x2="120" y2="230" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="241" cy="230" r="3" fill="#334155"/>
  <text x="110" y="225" text-anchor="end" font-size="12" font-weight="700" fill="#1e293b">CONDUCTOR CASING</text>
  <text x="110" y="240" text-anchor="end" font-size="10" fill="#64748b">30" - 20" OD | Structural Foundation</text>

  <line x1="280" y1="400" x2="120" y2="400" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="280" cy="400" r="3" fill="#475569"/>
  <text x="110" y="395" text-anchor="end" font-size="12" font-weight="700" fill="#1e293b">SURFACE CASING</text>
  <text x="110" y="410" text-anchor="end" font-size="10" fill="#64748b">13-3/8" OD | Freshwater Protection</text>

  <line x1="319" y1="620" x2="120" y2="620" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="319" cy="620" r="3" fill="#1e293b"/>
  <text x="110" y="615" text-anchor="end" font-size="12" font-weight="700" fill="#1e293b">INTERMEDIATE CASING</text>
  <text x="110" y="630" text-anchor="end" font-size="10" fill="#64748b">9-5/8" OD | Abnormally Pressured Zones</text>

  <line x1="358" y1="890" x2="120" y2="890" stroke="#0369a1" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="358" cy="890" r="3" fill="#0369a1"/>
  <text x="110" y="885" text-anchor="end" font-size="12" font-weight="700" fill="#0369a1">PRODUCTION CASING</text>
  <text x="110" y="900" text-anchor="end" font-size="10" fill="#64748b">7" or 5-12" OD | Zonal Isolation</text>

  <line x1="442" y1="310" x2="780" y2="310" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="442" cy="310" r="3" fill="#b45309"/>
  <text x="790" y="305" text-anchor="start" font-size="12" font-weight="700" fill="#b45309">PRODUCTION TUBING</text>
  <text x="790" y="320" text-anchor="start" font-size="10" fill="#64748b">2-7/8" - 3-1/2" Flow Conduit</text>

  <line x1="320" y1="840" x2="120" y2="840" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="320" cy="840" r="3" fill="#94a3b8"/>
  <text x="110" y="835" text-anchor="end" font-size="12" font-weight="700" fill="#475569">ANNULAR CEMENT</text>
  <text x="110" y="850" text-anchor="end" font-size="10" fill="#64748b">Hydraulic Seal & Pipe Support</text>

  <line x1="539" y1="840" x2="780" y2="840" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="539" cy="840" r="3" fill="#dc2626"/>
  <text x="790" y="835" text-anchor="start" font-size="12" font-weight="700" fill="#dc2626">PRODUCTION PACKER</text>
  <text x="790" y="850" text-anchor="start" font-size="10" fill="#64748b">Isolates Tubing-Casing Annulus</text>

  <line x1="330" y1="90" x2="120" y2="90" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="330" cy="90" r="3" fill="#0f172a"/>
  <text x="110" y="85" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">WELLHEAD HOUSING</text>
  <text x="110" y="100" text-anchor="end" font-size="10" fill="#64748b">Nested Casing Hangers & Seals</text>

</svg>
